name: APK Android

# Compila l'app a ogni modifica del sito o dell'app e la pubblica sempre allo stesso indirizzo:
# https://github.com/Baffo0/Orari-Circumvesuviana-By-Baffo/releases/download/apk/vesuora.apk
on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-apk
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      # L'Android SDK è già installato sulle macchine ubuntu-latest di GitHub.
      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Lo stesso APK anche dentro uno ZIP: alcune versioni di Chrome per Android lasciano
      # il download di un APK fermo al 100%, mentre uno ZIP si scarica come un file normale.
      - name: Rinomina l'APK e prepara lo ZIP
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vesuora.apk
          zip -j -X vesuora.zip vesuora.apk

      - name: Salva l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesuora-apk
          path: |
            vesuora.apk
            vesuora.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-apk-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Recupera l'APK compilato
        uses: actions/download-artifact@v4
        with:
          name: vesuora-apk

      - name: Pubblica la release (apk)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          test -s vesuora.apk
          test -s vesuora.zip

          cat > release-notes.md <<NOTES
          **VesuOra** per Android, versione 1.0.${RUN_NUMBER}: le fermate della Circumvesuviana (Napoli – Sorrento e Napoli – Poggiomarino) con i tabelloni EAV in tempo reale.

          **Come installarla**
          1. Samsung Galaxy: disattiva prima «Blocco automatico» in Impostazioni → Sicurezza e privacy → Blocco automatico (puoi riattivarlo dopo l'installazione).
          2. Apri con Chrome o Samsung Internet: https://github.com/${GH_REPO}/releases/download/apk/vesuora.apk e, se avvisa, tocca «Scarica comunque».
          3. Apri il file dalla notifica del download o da «Archivio» → Download. Se il download resta fermo al 100%, scarica lo ZIP https://github.com/${GH_REPO}/releases/download/apk/vesuora.zip, estrailo con «Archivio» e tocca vesuora.apk.
          4. Se richiesto, consenti di «installare app sconosciute». Se Play Protect avvisa, tocca «Altri dettagli» → «Installa comunque».

          Le versioni nuove si installano sopra la vecchia come aggiornamento. Installa e aggiorna l'app solo da questo link.
          NOTES

          for attempt in 1 2 3; do
            gh release delete apk --cleanup-tag --yes || true
            if gh release create apk vesuora.apk vesuora.zip \
                --target "${COMMIT_SHA}" \
                --title "VesuOra per Android (build ${RUN_NUMBER})" \
                --notes-file release-notes.md; then
              exit 0
            fi
            echo "Pubblicazione non riuscita (tentativo ${attempt}), riprovo tra 15 secondi."
            sleep 15
          done
          exit 1
